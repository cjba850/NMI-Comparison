<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NMI Energy Plan Calculator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    label { display:block; margin:.5rem 0 .2rem; font-weight:600; }
    input, select, button { padding:.5rem; font:inherit; }
    table { border-collapse: collapse; width:100%; margin-top:1rem; }
    th,td { border:1px solid #ddd; padding:.45rem; text-align:left; }
    pre { overflow:auto; background:#f6f6f6; padding:1rem; }
    .row { display:flex; gap:1rem; flex-wrap:wrap; align-items:end; }
  </style>
</head>
<body>
<h1>NMI Energy Plan Calculator v0.3</h1>

<section>
  <h2>1. Download NMI data from AEMO</h2>
  <p>AEMO API credentials remain on the server. Enter the NMI and requested date range only.</p>
  <div class="row">
    <div><label>NMI</label><input id="aemoNmi" placeholder="e.g. 2001234567" inputmode="numeric"></div>
    <div><label>Start</label><input id="aemoStart" type="date"></div>
    <div><label>End</label><input id="aemoEnd" type="date"></div>
    <div><label>Interval reads</label><select id="aemoReads"><option>FULL</option><option>MIN_30</option></select></div>
    <button onclick="downloadAemo()">Download CSV</button>
    <button onclick="previewAemo()">Preview</button>
  </div>
  <pre id="aemoStatus">AEMO connector status will appear here.</pre>
</section>

<section>
  <h2>2. Calculate plans</h2>
  <form id="calc">
    <label>NMI usage CSV</label><input name="file" type="file" accept=".csv" required>
    <label>Year</label><input name="year" type="number" value="2025" required>
    <label>NEM region</label>
    <select name="region"><option>NSW1</option><option>VIC1</option><option>QLD1</option><option>SA1</option><option>TAS1</option></select>
    <label>Optional AEMO spot-price CSV</label><input name="spot_file" type="file" accept=".csv">
    <p><button>Calculate comparison</button></p>
  </form>
  <pre id="status"></pre>
  <div id="results"></div>
</section>

<script>
function aemoParams() {
  const nmi = document.getElementById('aemoNmi').value.trim();
  const start = document.getElementById('aemoStart').value;
  const end = document.getElementById('aemoEnd').value;
  const reads = document.getElementById('aemoReads').value;
  if (!nmi || !start || !end) throw new Error('Enter NMI, start and end dates.');
  return {nmi, qs:`start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}&interval_reads=${reads}`};
}
async function previewAemo() {
  const status = document.getElementById('aemoStatus');
  try {
    const p = aemoParams();
    status.textContent = 'Downloading usage from AEMO…';
    const r = await fetch(`/api/aemo/nmi/${encodeURIComponent(p.nmi)}/usage?${p.qs}`);
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'AEMO request failed');
    status.textContent = JSON.stringify({nmi:data.nmi, count:data.count, total_kwh:data.total_kwh, first:data.intervals[0], last:data.intervals[data.intervals.length-1]}, null, 2);
  } catch (e) { status.textContent = e.message; }
}
function downloadAemo() {
  try {
    const p = aemoParams();
    window.location.href = `/api/aemo/nmi/${encodeURIComponent(p.nmi)}/download?${p.qs}`;
  } catch (e) { document.getElementById('aemoStatus').textContent = e.message; }
}

document.getElementById('calc').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  const status = document.getElementById('status');
  status.textContent = 'Calculating…';
  const r = await fetch('/api/calculate', {method:'POST', body:form});
  const data = await r.json();
  if (!r.ok) { status.textContent = data.detail || 'Request failed'; return; }
  status.textContent = `Loaded ${data.plans.length} plan results.`;
  const rows = (data.comparison.sorted_by_total_cost || []).map(x => `<tr><td>${x.provider}</td><td>${x.plan}</td><td>${x.type}</td><td>$${x.total_cost.toFixed(2)}</td><td>${x.effective_cents_per_kwh ?? ''}</td></tr>`).join('');
  document.getElementById('results').innerHTML = `<table><thead><tr><th>Provider</th><th>Plan</th><th>Type</th><th>Annual cost</th><th>Effective c/kWh</th></tr></thead><tbody>${rows}</tbody></table><pre>${JSON.stringify(data, null, 2)}</pre>`;
});
</script>
</body>
</html>
